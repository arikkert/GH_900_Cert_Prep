name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting an issue."
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: "App crashes on login"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the issue
    validations:
      required: true
